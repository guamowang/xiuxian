<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修仙面板 - 太虚道卷</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <!-- 登录/注册界面 -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h2 class="login-title">入 卷</h2>
            <p class="login-subtitle">道 友 请 留 步</p>
            <div class="login-divider"></div>
            <div class="login-field">
                <label for="login-dao-name">道号</label>
                <input type="text" id="login-dao-name" placeholder="请输入道号" autocomplete="off">
            </div>
            <div class="login-field">
                <label for="login-spirit-mark">神纹</label>
                <input type="password" id="login-spirit-mark" placeholder="请输入神纹" autocomplete="off">
            </div>
            <button id="login-btn" class="login-btn">入 卷</button>
            <div id="login-message" class="login-message"></div>
        </div>
    </div>

    <!-- 修炼完成确认对话框 -->
    <div id="cultivation-complete-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h3>修炼完成确认</h3>
            <p class="modal-text">道友，请确保对应属性修炼已达成1小时，才能算完成一次修炼，请道友留下修炼痕迹</p>
            <textarea id="cultivation-note" placeholder="请输入修炼痕迹..." rows="4"></textarea>
            <div class="modal-buttons">
                <button id="confirm-complete-btn">确认完成</button>
                <button id="cancel-complete-btn">取消</button>
            </div>
        </div>
    </div>

    <!-- 主面板（初始隐藏，登录后显示） -->
    <div id="main-container" class="main-container" style="display:none;">
        <!-- ===== 修仙者信息面板 ===== -->
        <div class="cultivation-panel" id="main-panel">
            <div class="corner-decoration corner-tl"></div>
            <div class="corner-decoration corner-tr"></div>
            <div class="corner-decoration corner-bl"></div>
            <div class="corner-decoration corner-br"></div>

            <div class="header-section">
                <h1 class="panel-title">太 虚 道 卷</h1>
                <p class="panel-subtitle">C U L T I V A T I O N &nbsp; R E C O R D</p>
                <div class="divider"></div>
            </div>

            <div class="identity-section">
                <div class="identity-item">
                    <div class="identity-label">道号</div>
                    <div class="identity-value name" id="dao-name">云 逸 真 人</div>
                </div>
                <div class="identity-item">
                    <div class="identity-label">骨龄</div>
                    <div class="identity-value" id="age-display">27</div>
                </div>
                <div class="identity-item">
                    <div class="identity-label">境界</div>
                    <div class="identity-value" id="stage-display">练 气 期</div>
                </div>
            </div>

            <div class="cultivation-core">
                <div class="cultivation-stage" id="stage-name">练 气 期</div>
                <div class="cultivation-value-row">
                    <span class="cultivation-label">修 为 值</span>
                    <span class="cultivation-number" id="cultivation-value">47</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progress-fill" style="width:47%;"></div>
                </div>
                <div class="progress-text" id="progress-text">距突破 筑基期 还需 53 修为</div>
            </div>

            <!-- 五项属性修炼区 -->
            <div class="attributes-section">
                <div class="attribute-card attr-int" id="card-int" data-attribute="intelligence">
                    <span class="attribute-icon">📖</span>
                    <span class="attribute-name">智 力</span>
                    <span class="attribute-value" id="attr-int">12</span>
                    <span class="attribute-hint">看书 课程</span>
                    <span class="attribute-status" id="status-int">开始修炼</span>
                    <span class="cancel-cultivation-btn" id="cancel-int" style="display:none;">取消</span>
                </div>
                <div class="attribute-card attr-str" id="card-str" data-attribute="strength">
                    <span class="attribute-icon">💪</span>
                    <span class="attribute-name">体 质</span>
                    <span class="attribute-value" id="attr-str">9</span>
                    <span class="attribute-hint">健身 运动</span>
                    <span class="attribute-status" id="status-str">开始修炼</span>
                    <span class="cancel-cultivation-btn" id="cancel-str" style="display:none;">取消</span>
                </div>
                <div class="attribute-card attr-ord" id="card-ord" data-attribute="order">
                    <span class="attribute-icon">📐</span>
                    <span class="attribute-name">秩 序</span>
                    <span class="attribute-value" id="attr-ord">14</span>
                    <span class="attribute-hint">整理 收拾</span>
                    <span class="attribute-status" id="status-ord">开始修炼</span>
                    <span class="cancel-cultivation-btn" id="cancel-ord" style="display:none;">取消</span>
                </div>
                <div class="attribute-card attr-dex" id="card-dex" data-attribute="dexterity">
                    <span class="attribute-icon">🍃</span>
                    <span class="attribute-name">灵 巧</span>
                    <span class="attribute-value" id="attr-dex">11</span>
                    <span class="attribute-hint">创作 输出</span>
                    <span class="attribute-status" id="status-dex">开始修炼</span>
                    <span class="cancel-cultivation-btn" id="cancel-dex" style="display:none;">取消</span>
                </div>
                <div class="attribute-card attr-lck" id="card-lck" data-attribute="luck">
                    <span class="attribute-icon">🍀</span>
                    <span class="attribute-name">幸 运</span>
                    <span class="attribute-value" id="attr-lck">8</span>
                    <span class="attribute-hint">利他 善事</span>
                    <span class="attribute-status" id="status-lck">开始修炼</span>
                    <span class="cancel-cultivation-btn" id="cancel-lck" style="display:none;">取消</span>
                </div>
            </div>

            <div class="recent-log-area">
                <span class="recent-log-text" id="recent-log">— 点击属性卡片开始修炼 —</span>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
